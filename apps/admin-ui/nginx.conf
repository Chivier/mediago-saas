server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Generated at container start from $ADMIN_USER and $ADMIN_PASSWORD.
    auth_basic            "MediaGo Admin";
    auth_basic_user_file  /etc/nginx/.htpasswd;

    # Allow streaming large files (video previews, SRT downloads)
    client_max_body_size  0;
    proxy_buffering       off;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — Go backend (downloads, tasks, events) on port 8080
    location /api/core/ {
        proxy_pass http://mediago-core:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # SSE on /api/events needs unbuffered streaming and no idle timeout cap
        proxy_set_header Connection "";
    }

    # API proxy — Restful gateway (batch tasks, files, storage) on port 8898
    location /api/restful/ {
        proxy_pass http://mediago-restful:8898/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API proxy — AI service (subtitles, summaries) on port 8899
    location /api/ai/ {
        proxy_pass http://mediago-ai:8899/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API proxy — follow-tracker (subscriptions / auto-update) on port 8900
    location /api/follow/ {
        proxy_pass http://mediago-follow:8900/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Selenium-driven /creators (resolve / refresh) can take 30+ seconds
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
