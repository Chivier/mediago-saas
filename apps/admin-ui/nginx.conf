server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — Go backend
    location /go-api/ {
        proxy_pass http://mediago-core:8080/;
        proxy_set_header Host $host;
    }

    # API proxy — Restful
    location /restful-api/ {
        proxy_pass http://mediago-restful:8898/;
        proxy_set_header Host $host;
    }

    # API proxy — AI service
    location /ai-api/ {
        proxy_pass http://mediago-ai:8899/;
        proxy_set_header Host $host;
    }
}
